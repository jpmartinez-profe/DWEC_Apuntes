site_name: Apuntes DWEC
site_description: Apuntes de Desarrollo Web en Entorno Cliente

theme:
  name: material
  language: es

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details

  - pymdownx.highlight:
      use_pygments: false

  - pymdownx.superfences

  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js
  - javascripts/playground.js

extra_css:
  - stylesheets/playground.css
  - https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css

nav:
  - Inicio: index.md
  - Unidad 1:
      - Documentación: unidad1/unidad1.md
      - Debugging: unidad1/debugging.md
      - Cuestionarios: unidad1/cuestionarios.md
      - Mapa Conceptual: unidad1/mapa_conceptual.md
  - Ayuda:
      - Markdown y ejemplos interactivos: ayuda/markdown.md